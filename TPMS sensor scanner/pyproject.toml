[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tpms-sensor-scanner"
version = "0.1.0"
description = "Receive, normalize, and inspect TPMS telemetry decoded by rtl_433"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "James Roberts" }]
keywords = ["tpms", "telemetry", "rtl-433", "sdr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
]
dependencies = []

[project.scripts]
tpms-scan = "tpms_scanner.cli:main"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tpms_scanner"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
