[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ism-scanner"
version = "0.1.0"
description = "See and classify everything a 433 MHz RTL-SDR can hear"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "James Roberts" }]
keywords = ["rtl-433", "sdr", "433mhz", "ism"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
ism-scan = "ism_scanner.cli:main"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ism_scanner"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
