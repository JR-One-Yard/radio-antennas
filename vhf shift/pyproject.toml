[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meteor-lease"
version = "0.2.0"
description = "Steal the NESDR for one Meteor weather pass, then give it back to the idle occupant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "James Roberts" }]
keywords = ["satdump", "meteor", "rtl-sdr", "vhf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
meteor-lease = "meteor_lease.cli:main"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meteor_lease"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
